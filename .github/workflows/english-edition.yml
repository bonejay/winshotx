name: Build English edition

on:
  workflow_dispatch:
  push:
    branches: [english-capture]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm test
      - run: cargo check --manifest-path src-tauri/Cargo.toml --tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib encode::ffmpeg::tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib english_edition_tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib audio_devices::tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib pacing_tests
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: WinShotX-English-Windows-x64
          path: src-tauri/target/release/winshotx.exe
